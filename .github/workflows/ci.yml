name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 22.x
      uses: actions/setup-node@v3
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Build Proxy
      run: npm run build

    - name: Run Tests
      run: npx vitest run

    - name: Build Docker Image
      run: docker build -t carbonroute-proxy .

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 22.x
      uses: actions/setup-node@v3
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: carbonroute-ui/package-lock.json

    - name: Install Dependencies
      run: npm ci
      working-directory: ./carbonroute-ui

    - name: Build UI
      run: npm run build
      working-directory: ./carbonroute-ui
