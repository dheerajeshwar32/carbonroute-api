name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-gateway:
    name: Backend Gateway CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Vitest Suite
        run: npm test

      - name: Compile Dist Build
        run: npm run build

  frontend-client:
    name: Frontend Monorepo Client CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: carbonroute-ui/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./carbonroute-ui

      - name: Build Frontend Client
        run: npm run build
        working-directory: ./carbonroute-ui
