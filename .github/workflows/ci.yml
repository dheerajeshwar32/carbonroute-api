name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 22.x
      uses: actions/setup-node@v3
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: carbonroute-proxy/package-lock.json

    - name: Install Dependencies
      run: npm ci
      working-directory: carbonroute-proxy

    - name: Build Proxy
      run: npm run build
      working-directory: carbonroute-proxy

    - name: Run Tests
      run: npx vitest run
      working-directory: carbonroute-proxy

    - name: Build Docker Image
      run: docker build -t carbonroute-proxy .
      working-directory: carbonroute-proxy
